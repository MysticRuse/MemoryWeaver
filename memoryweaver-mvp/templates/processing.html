<!DOCTYPE html><html><head>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>MemoryWeaver — Generating...</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:0 auto;padding:40px 20px;background:#f5f5f5;text-align:center}
.card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
h2{color:#085041;font-size:20px;margin-bottom:8px}
p{color:#555;font-size:14px}
.spinner{width:48px;height:48px;border:5px solid #E1F5EE;border-top-color:#1D9E75;
         border-radius:50%;animation:spin 1s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#c0392b;background:#fdecea;border-radius:8px;padding:12px;margin-top:16px;font-size:13px}
</style>
<script>
function poll(){
  fetch('/status').then(r=>r.json()).then(d=>{
    if(d.error){
      document.getElementById('msg').textContent = 'Error: ' + d.error;
      document.getElementById('spinner').style.display='none';
    } else if(d.done && !d.running){
      window.location='/results';
    } else {
      setTimeout(poll, 3000);
    }
  });
}
window.onload = poll;
</script>
</head><body>
<div class='card'>
  <div class='spinner' id='spinner'></div>
  <h2>⚽ Creating your Match Story</h2>
  <p id='msg'>Analysing photos and generating story — this takes a minute or two due to API rate limits. Hang tight!</p>
</div>
</body></html>
