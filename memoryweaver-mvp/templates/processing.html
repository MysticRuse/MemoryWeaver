<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MemoryWeaver — Generating Match Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1d9e75;
      --primary-dark: #085041;
      --primary-light: #e1f5ee;
      --bg: #f5fcf9;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --shadow-lg: 0 20px 25px -5px rgba(29,158,117,0.08), 0 10px 10px -5px rgba(29,158,117,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 480px; }
    .card { background: var(--card-bg); border-radius: 24px; padding: 40px 32px; box-shadow: var(--shadow-lg); border: 1px solid rgba(29,158,117,0.1); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    h2 { color: var(--primary-dark); font-size: 22px; font-weight: 700; }
    .stage { font-size: 13px; color: var(--primary); font-weight: 600; min-height: 18px; }
    .elapsed { font-size: 12px; color: var(--text-muted); }
    .spinner { width: 60px; height: 60px; border: 4px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 8px 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log { background: #f8fafb; border-radius: 10px; padding: 12px; font-size: 12px; font-family: monospace; color: #444; max-height: 180px; overflow-y: auto; line-height: 1.6; text-align: left; width: 100%; border: 1px solid var(--primary-light); }
    .log-line { border-bottom: 1px solid #eef2f6; padding: 2px 0; }
    .log-line:last-child { border-bottom: none; }
    .error-box { background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 12px; padding: 16px; color: #721c24; font-size: 13px; margin-top: 12px; text-align: left; width: 100%; }
    .error-box strong { display: block; margin-bottom: 6px; }
    .btn { display: inline-block; margin-top: 10px; background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-grey { background: #888; margin-left: 8px; }
  </style>
  <script>
    var pollTimer;
    function poll() {
      // Cache-bust to prevent Safari aggressively caching the status response
      fetch('/status?t=' + Date.now())
        .then(function(response) {
          if (!response.ok) throw new Error('Network response error');
          return response.json();
        })
        .then(function(d) {
          document.getElementById('elapsed').textContent = d.elapsed + 's elapsed';
          if (d.stage) document.getElementById('stage').textContent = d.stage;

          var logEl = document.getElementById('log');
          logEl.innerHTML = (d.log || []).map(function(l) {
            return "<div class='log-line'>" + l + "</div>";
          }).join('');
          logEl.scrollTop = logEl.scrollHeight;

          if (d.error) {
            clearTimeout(pollTimer);
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('stage').textContent = 'Failed';
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-msg').textContent = d.error;
          } else if (d.done && !d.running) {
            clearTimeout(pollTimer);
            window.location = '/results';
          } else {
            pollTimer = setTimeout(poll, 3000);
          }
        })
        .catch(function(err) {
          console.error('Polling error:', err);
          pollTimer = setTimeout(poll, 4000);
        });
    }
    window.onload = function() { pollTimer = setTimeout(poll, 1000); };
  </script>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h2>⚽ Creating your Match Story</h2>
      <div class="stage" id="stage">Starting...</div>
      <div class="elapsed" id="elapsed">0s elapsed</div>
      <div class="log" id="log"><div class="log-line" style="color:#aaa">Waiting for pipeline to start...</div></div>
      <div class="error-box" id="error-box" style="display:none">
        <strong>Pipeline failed</strong>
        <span id="error-msg"></span>
        <div style="margin-top:12px">
          <a href="/generate" class="btn">Retry</a>
          <a href="/" class="btn btn-grey">Back to Upload</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
