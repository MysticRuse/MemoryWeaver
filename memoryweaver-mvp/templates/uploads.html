<!DOCTYPE html><html><head>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>MemoryWeaver — AUS vs PAR</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:0 auto;padding:20px;background:#f5f5f5}
h1{color:#085041;font-size:22px;margin-bottom:4px}
p{color:#555;font-size:14px;margin:4px 0 16px}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.btn{background:#1D9E75;color:#fff;border:none;padding:14px 28px;border-radius:8px;
     font-size:16px;width:100%;cursor:pointer;margin-top:12px}
.btn:active{background:#085041}
.count{background:#E1F5EE;color:#085041;border-radius:8px;padding:10px;text-align:center;
       font-size:13px;margin-top:16px}
.success{color:#085041;font-weight:bold;margin-top:12px}
input[type=file]{width:100%;padding:10px 0;font-size:14px}
</style></head><body>
<div class='card'>
<h1>⚽ Paraguay vs Australia</h1>
<p>Levi's Stadium &bull; June 25, 2026 &bull; Upload your match photos!</p>
<form action='/upload' method='POST' enctype='multipart/form-data'>
  <input type='file' name='photos' multiple accept='image/*,video/*'>
  <button class='btn' type='submit'>📸 Add to MemoryWeaver</button>
</form>
{% if success %}<p class='success'>{{ success }}</p>{% endif %}
<div class='count'>📷 {{ count }} photo(s) in the album so far</div>
</div>
<p style='text-align:center;font-size:12px;color:#aaa;margin-top:20px'>
No login needed &bull; Your photos create our match story</p>
</body></html>
