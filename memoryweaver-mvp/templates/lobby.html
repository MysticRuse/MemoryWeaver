<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MemoryWeaver MVP - Select Match</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl shadow-slate-200/50 border border-white p-10 max-w-lg w-full">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white mb-6 shadow-lg shadow-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">MemoryWeaver</h1>
      <p class="text-slate-500 mt-3 text-lg">Select a match session to begin curating</p>
    </div>
    
    <div class="space-y-4">
      <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest px-1">Available Sessions</h3>
      
      <!-- Card 1 -->
      <a href="/FIFA26_PARAGUAY_AUSTRALIA/" class="group block relative p-6 bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl hover:shadow-indigo-500/10 hover:border-indigo-100 transition-all duration-300 transform hover:-translate-y-1 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/5 to-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        <div class="relative flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <div class="text-4xl">🇵🇾 🇦🇺</div>
            <div>
              <h3 class="text-lg font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">Paraguay vs Australia</h3>
              <p class="text-sm text-slate-500 mt-1">FIFA World Cup 2026</p>
            </div>
          </div>
          <div class="text-slate-300 group-hover:text-indigo-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>
      </a>

      <!-- Card 2 -->
      <a href="/FIFA26_SWITZERLAND_ALGERIA/" class="group block relative p-6 bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl hover:shadow-emerald-500/10 hover:border-emerald-100 transition-all duration-300 transform hover:-translate-y-1 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-emerald-500/5 to-teal-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        <div class="relative flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <div class="text-4xl">🇨🇭 🇩🇿</div>
            <div>
              <h3 class="text-lg font-bold text-slate-800 group-hover:text-emerald-600 transition-colors">Switzerland vs Algeria</h3>
              <p class="text-sm text-slate-500 mt-1">FIFA World Cup 2026</p>
            </div>
          </div>
          <div class="text-slate-300 group-hover:text-emerald-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
