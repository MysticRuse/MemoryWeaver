[project]
name = "memoryweaver"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]



# Core runtime only. Heavy/optional features live in extras below so the
# default `uv sync` stays small: local-preclean (torch CLIP stack for the
# macOS bulk import wizard) and drive-import (scripts/drive_downloader.py).
dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "a2a-sdk[http-server]~=0.3.22",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-storage>=2.14.0",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
    "python-multipart>=0.0.20,<1.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pillow-heif>=1.4.0",
    "numpy>=1.26.0",
    "qrcode>=8.2",
    "mcp>=1.28.1",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
# On-device CLIP dedup/blur pre-cleaning for the bulk local-folder wizard
# (macOS/local only; the UI hides the feature elsewhere). ~2GB+ download.
local-preclean = [
    "torch>=2.12.1",
    "sentence-transformers>=5.6.0",
    "scikit-learn>=1.9.0",
]
# scripts/drive_downloader.py - manual Google Drive folder import
drive-import = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"




[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


